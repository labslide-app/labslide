<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LabSlide — 课题组组会 PPT 在线批注与知识沉淀</title>
    <style>
      #wechat-tip {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 99999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      #wechat-tip.show {
        display: flex;
      }
      #wechat-tip .tip-icon {
        width: 64px;
        height: 64px;
        margin-bottom: 20px;
        border-radius: 16px;
        background: #4f46e5;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
      }
      #wechat-tip h2 {
        font-size: 20px;
        margin: 0 0 8px;
        font-weight: 600;
      }
      #wechat-tip p {
        font-size: 14px;
        color: #a1a1aa;
        margin: 0 0 24px;
        line-height: 1.6;
      }
      #wechat-tip .tip-btn {
        display: inline-block;
        padding: 12px 32px;
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        text-decoration: none;
        margin: 4px;
      }
      #wechat-tip .tip-btn.secondary {
        background: rgba(255, 255, 255, 0.15);
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased">
    <div id="wechat-tip">
      <div class="tip-icon">📋</div>
      <h2>请在浏览器中打开</h2>
      <p>点击右上角 ··· 菜单<br>选择「在浏览器中打开」</p>
      <button class="tip-btn" onclick="copyLink()">复制链接</button>
      <a class="tip-btn secondary" href="javascript:void(0)" onclick="copyLink()">已复制，去浏览器粘贴</a>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var ua = navigator.userAgent.toLowerCase();
        var isWechat = ua.indexOf('micromessenger') > -1;
        if (isWechat) {
          document.getElementById('wechat-tip').classList.add('show');
        }
        window.copyLink = function () {
          var url = window.location.href;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(function () {
              alert('链接已复制，请粘贴到浏览器地址栏打开');
            });
          } else {
            var ta = document.createElement('textarea');
            ta.value = url;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            alert('链接已复制，请粘贴到浏览器地址栏打开');
          }
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
