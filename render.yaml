services:
  - type: web
    name: labslide-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: labslide-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: MINIO_HOST
        value: "127.0.0.1"
      - key: MINIO_PORT
        value: "1"
      - key: BACKEND_CORS_ORIGINS
        value: '["https://labslide.vercel.app"]'

databases:
  - name: labslide-db
    plan: free