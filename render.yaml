services:
  - type: web
    name: labslide-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: labslide-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: STORAGE_DIR
        value: storage
      - key: BACKEND_CORS_ORIGINS
        value: '["https://labslide.pages.dev","https://labslide-app.netlify.app","https://labslide.onrender.com"]'
    databases:
  - name: labslide-db
    plan: free