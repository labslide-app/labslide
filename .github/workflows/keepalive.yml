name: Keep Render Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://labslide.onrender.com/api/v1/health)
          echo "Health check: $response"
          if [ "$response" != "200" ]; then
            echo "Health check failed, retrying..."
            sleep 5
            curl -s -o /dev/null -w "%{http_code}" https://labslide.onrender.com/api/v1/health
          fi
          
